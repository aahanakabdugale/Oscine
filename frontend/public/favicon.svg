<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="oscine-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#oscine-grad)" />
  
  <!-- Sleek soundwave / speech frequency pulses -->
  <g fill="#FFFFFF" filter="url(#glow)">
    <!-- Central pulse bars representing prosody & acoustic waves -->
    <rect x="12" y="26" width="4" height="12" rx="2" opacity="0.75" />
    <rect x="20" y="18" width="4" height="28" rx="2" opacity="0.9" />
    <rect x="28" y="12" width="4" height="40" rx="2" />
    <rect x="36" y="20" width="4" height="24" rx="2" opacity="0.95" />
    <rect x="44" y="15" width="4" height="34" rx="2" opacity="0.85" />
    <rect x="52" y="27" width="4" height="10" rx="2" opacity="0.7" />
  </g>
</svg>